# Destinations shown on /destinations/ and used for per-destination hub pages.
# Each entry:
#   name:  display name
#   slug:  must match both the tag used on posts AND the folder under /destinations/
#   image: banner/thumbnail path
#   blurb: one-liner for the hub card
#
# To add a destination: add an entry here, tag posts with the slug, and create
# destinations/<slug>/index.html with `layout: destination` (copy an existing one).

