# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: RoamingLetters
email: nagpalkaran95@gmail.com
description: >- # this means to ignore newlines until "baseurl:"
  Travel stories, gear picks & honest recommendations
baseurl: "/roamingletters" # updated after GitHub repo rename
url: "https://nagpalkaran95.github.io"
author: Karan Nagpal
# Partner name shown on /about/
partner_name: "Divya Gaba"

# Brand
brand: RoamingLetters

# Amazon Associates
amazon_affiliate_tag: roamingletter-21
amazon_base_url: "https://www.amazon.in"

# Social Profiles
facebook_username: null
linkedin_username: null
twitter_username: null
github_username: null
instagram_username: roamingletters
youtube_username: "@roamingletters"

# google_analytics
google_analytics: UA-175438287-1

# Build settings
remote_theme: jekyll-theme-clean-blog
markdown:           kramdown
paginate:           5
paginate_path:      "/posts/page:num/"
permalink:          /:slug/
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap ## Uncomment this line to silently generate a sitemaps.org compliant sitemap for your Jekyll site
  - jekyll-seo-tag
  - jekyll-responsive-image
  - jekyll-redirect-from

# Featured post shown in the "Start Here" home banner
# Value must match a post's slug (URL segment after permalink: /:slug/)
featured_post_slug: vietnam
featured_post_label: "Read Vietnam Diary"
featured_post_intro: "Start with my Vietnam trip diary - 9 days, 3 cities, one unforgettable adventure."

# responsive_image:
#   template: _includes/responsive-image.html
#   sizes:
#     - width: 320
#     - width: 480
#     - width: 800

responsive_image:
  template: _includes/responsive-image.html #THIS ONE
  default_quality: 90
  sizes:
    - width: 480  # [Required] How wide the resized image will be.
      quality: 80 # [Optional] Overrides default_quality for this size.
    - width: 800
    - width: 1400
      quality: 90
  auto_rotate: false
  strip: true
# [Optional, Default: assets]
  # The base directory where assets are stored. This is used to determine the
  # `dirname` value in `output_path_format` below.
  base_path: img
# [Optional, Default: assets/resized/%{filename}-%{width}x%{height}.%{extension}]
  # The template used when generating filenames for resized images. Must be a
  # relative path.
  #
  # Parameters available are:
  #   %{dirname}     Directory of the file relative to `base_path` (assets/sub/dir/some-file.jpg => sub/dir)
  #   %{basename}    Basename of the file (assets/some-file.jpg => some-file.jpg)
  #   %{filename}    Basename without the extension (assets/some-file.jpg => some-file)
  #   %{extension}   Extension of the file (assets/some-file.jpg => jpg)
  #   %{width}       Width of the resized image
  #   %{height}      Height of the resized image
  #
  output_path_format: assets/resized/%{width}/%{basename}
# [Optional, Default: true]
  # Whether or not to save the generated assets into the source folder.
  # save_to_source: false
# [Optional, Default: false]
  # Cache the result of {% responsive_image %} and {% responsive_image_block %}
  # tags. See the "Caching" section of the README for more information.
  # cache: false
# [Optional, Default: []]
  # By default, only images referenced by the responsive_image and responsive_image_block
  # tags are resized. Here you can set a list of paths or path globs to resize other
  # images. This is useful for resizing images which will be referenced from stylesheets.
  extra_images:
    - img/*/*/*/*.{jpeg,jpg}

